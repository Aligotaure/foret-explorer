# Vérifie chaque jour que les services utilisés par la carte répondent : IGN (tuiles, altitude,
# recherche, polices), Open-Meteo et le site en ligne (archives des tuiles de géologie et des zones,
# lues par morceaux ; zones et coupes datées refaites il y a moins de 13 mois ; fichiers météo
# communs, dont le dernier jour ne doit pas avoir plus de 36 heures). Une ou deux requêtes par service. En cas d'échec, l'exécution apparaît en rouge dans
# l'onglet Actions et GitHub envoie un e-mail de notification (réglage par défaut des notifications
# Actions).
#
# Open-Meteo à part : la carte ne l'appelle qu'en secours, et c'est la tâche « Météo commune » qui
# s'en sert chaque jour, avec ses propres essais. Injoignable depuis GitHub (pas de réponse, limite
# d'appels, panne du serveur), il ne donne qu'un avertissement : ce qui compte, la météo commune à
# jour, est vérifié à part. Une réponse inattendue (autre code, autre format) reste une erreur.
#
# Attention : GitHub suspend les tâches planifiées d'un dépôt public sans activité depuis 60 jours ;
# il suffit alors de la réactiver dans l'onglet Actions.
name: Surveillance des services

on:
  schedule:
    # 5 h 17 l'hiver, 6 h 17 l'été, heure de Paris ; en pratique GitHub la lance souvent en fin de matinée.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    # Une vérification dure 100 s au plus (voir « demander ») et il y en a 17 : même si rien ne
    # répond, la tâche va au bout (29 minutes) et dit quoi. D'ordinaire : 20 secondes.
    timeout-minutes: 30
    steps:
      - name: Interroger les services
        run: |
          set +e
          echec=0
          demander() { # [options de curl] adresse : réponse dans « reponse », code HTTP affiché
            # Bornes : 10 s pour se connecter, 30 s par essai, 5 essais au plus, plus aucun passé une
            # minute. Sans --retry-max-time, curl attend aussi longtemps que le serveur le demande
            # (en-tête « Retry-After » d'une réponse 429 ou 503), sans rien écrire : le 15/11/2026 la
            # tâche est restée 10 minutes sur Open-Meteo, jusqu'à son annulation, sans vérifier la
            # suite. « timeout » : arrêt de force, quoi qu'il arrive (curl n'affiche alors aucun code).
            rm -f reponse
            timeout 100 curl -sS --connect-timeout 10 -m 30 --retry 4 --retry-max-time 60 -o reponse -w '%{http_code}' -H 'Origin: https://aligotaure.github.io' "$@"
          }
          dire() { # code rendu par « demander », en clair
            case $1 in
              '') echo 'arrêté au bout de 100 s' ;;
              000) echo 'pas de réponse' ;;
              *) echo "HTTP $1" ;;
            esac
          }
          injoignable() { # code : pas de réponse, limite d'appels atteinte (429) ou panne du serveur (5xx)
            case $1 in
              '' | 000 | 429 | 5??) return 0 ;;
              *) return 1 ;;
            esac
          }
          verifier() { # nom, adresse, texte attendu dans la réponse (facultatif), « secours » (facultatif)
            local nom=$1 url=$2 motif=${3:-} role=${4:-}
            local code
            code=$(demander "$url")
            if [ "$code" = 200 ] && { [ -z "$motif" ] || grep -q -- "$motif" reponse; }; then
              echo "OK  $nom ($(wc -c < reponse) octets)"
            elif [ "$role" = secours ] && injoignable "$code"; then
              echo "::warning::$nom injoignable depuis GitHub ($(dire "$code")). Sans effet sur la carte tant que la météo commune est à jour (vérifiée plus bas) : $url"
            else
              echo "::error::$nom ne répond pas correctement ($(dire "$code")) : $url"
              echec=1
            fi
          }
          archive() { # nom, adresse : une requête partielle doit rendre l'en-tête de l'archive PMTiles
            local nom=$1 url=$2
            local code
            code=$(demander -r 0-126 "$url")
            if [ "$code" != 206 ] || [ "$(head -c 7 reponse)" != PMTiles ]; then
              echo "::error::$nom : l'archive ne se lit pas par morceaux ($(dire "$code")) : $url"
              echec=1
            else
              echo "OK  $nom (archive lue par morceaux)"
            fi
          }
          W='https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal'
          verifier 'BD Forêt (tuiles vectorielles)' 'https://data.geopf.fr/tms/1.0.0/LANDCOVER-TMS.FORESTINVENTORY.V2/10/529/364.pbf'
          verifier 'BD Forêt (aperçu raster)' "$W&LAYER=LANDCOVER.FORESTINVENTORY.V2&TILEMATRIXSET=PM_6_16&FORMAT=image/png&TILEMATRIX=10&TILEROW=364&TILECOL=529"
          verifier 'Plan IGN' "$W&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIXSET=PM&FORMAT=image/png&TILEMATRIX=12&TILEROW=1455&TILECOL=2118"
          verifier 'Photographies aériennes' "$W&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&TILEMATRIXSET=PM&FORMAT=image/jpeg&TILEMATRIX=12&TILEROW=1455&TILECOL=2118"
          verifier 'Altitude IGN' 'https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=6.19&lat=45.92&resource=ign_rge_alti_wld&zonly=true' 'elevations'
          verifier 'Recherche de lieu IGN' 'https://data.geopf.fr/geocodage/completion?text=Annecy&type=StreetAddress,PositionOfInterest&maximumResponses=1' 'results'
          verifier 'Polices des étiquettes' 'https://data.geopf.fr/annexes/ressources/vectorTiles/fonts/Source%20Sans%20Pro%20Regular/0-255.pbf'
          verifier 'Open-Meteo' 'https://api.open-meteo.com/v1/forecast?latitude=45.92&longitude=6.19&daily=precipitation_sum&past_days=1&forecast_days=1&timezone=Europe/Paris' 'precipitation_sum' secours
          verifier 'Site en ligne' 'https://aligotaure.github.io/foret-explorer/' 'Forêt Explorer'
          verifier 'Page À propos' 'https://aligotaure.github.io/foret-explorer/a-propos.html' 'Mentions légales'
          verifier 'Nature du sol' 'https://aligotaure.github.io/foret-explorer/data/geologie/info.json' 'departements'
          archive 'Nature du sol' 'https://aligotaure.github.io/foret-explorer/data/geologie/geologie.pmtiles'
          verifier 'Zones protégées et forêts publiques' 'https://aligotaure.github.io/foret-explorer/data/zones/info.json' 'genere'
          # Refaites une fois par an par la publication (deploy.yml), qui garde l'ancienne archive si
          # le WFS de l'IGN refuse (couche renommée…) : passé 13 mois, la reconstruction échoue depuis
          # un mois. Lu ici, avant que « archive » ne remplace la réponse.
          genere=$(jq -r '.genere // empty' reponse 2>/dev/null)
          limite=$(date -u -d '395 days ago' +%FT%TZ)
          if [ -z "$genere" ] || [ "$genere" \< "$limite" ]; then
            echo "::error::Zones protégées et forêts publiques trop anciennes : archive du ${genere:-jour inconnu}, la reconstruction annuelle (deploy.yml) échoue sans doute."
            echec=1
          else
            echo "OK  Zones protégées et forêts publiques refaites le ${genere%%T*}"
          fi
          archive 'Zones protégées et forêts publiques' 'https://aligotaure.github.io/foret-explorer/data/zones/zones.pmtiles'
          verifier 'Coupes datées' 'https://aligotaure.github.io/foret-explorer/data/coupes/index.json' 'genere'
          # Refaites une fois par an par la publication (deploy.yml), qui garde les anciens fichiers si
          # Zenodo ne répond pas ou si l'archive de l'atlas a changé de forme : passé 13 mois, la
          # reconstruction échoue depuis un mois. Un index sans date (écrit faute de mieux) : jamais faite.
          genere=$(jq -r '.genere // empty' reponse 2>/dev/null)
          if [ -z "$genere" ] || [ "$genere" \< "$limite" ]; then
            echo "::error::Coupes datées trop anciennes : fichiers du ${genere:-jour inconnu}, la reconstruction annuelle (deploy.yml, scripts/coupes/construire.mjs) échoue sans doute."
            echec=1
          else
            echo "OK  Coupes datées refaites le ${genere%%T*} (atlas $(jq -r '.atlas // "?"' reponse), jusqu'en $(jq -r '.dernierAn // "?"' reponse))"
          fi
          verifier 'Météo commune' 'https://aligotaure.github.io/foret-explorer/data/meteo/index.json' 'dernierJour'
          # Le tour du jour se fait d'ordinaire dans la nuit, mais GitHub lance les tâches planifiées avec
          # parfois des heures de retard : alerte seulement si le dernier jour connu a plus de 36 heures
          # (avant midi, heure de Paris, avant-hier suffit encore ; ensuite il faut hier).
          dernier=$(jq -r '.dernierJour // empty' reponse 2>/dev/null)
          attendu=$(TZ=Europe/Paris date -d '36 hours ago' +%F)
          if [ -z "$dernier" ] || [ "$dernier" \< "$attendu" ]; then
            echo "::error::Météo commune en retard : dernier jour connu ${dernier:-inconnu}, attendu $attendu au moins (tâche « Météo commune » suspendue ou en panne ?)"
            echec=1
          else
            echo "OK  Météo commune à jour du $dernier ($(jq -r '"\(.aJour) cases à jour sur \(.cases)"' reponse))"
          fi
          exit $echec
