# Sonde temporaire n°2 : catalogues publics (liens officiels de la géologie) et Macrostrat.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Catalogues publics (data.gouv.fr, data.europa.eu)
        run: |
          mkdir -p probe2
          curl -s -m 60 "https://www.data.gouv.fr/api/1/datasets/cartes-geologiques-departementales-a-1-50-000-bd-charm-50/" -o probe2/datagouv-charm50.json || true
          curl -s -m 60 "https://www.data.gouv.fr/api/1/datasets/66631d4a67b5b112fafd0f8a/" -o probe2/datagouv-harm.json || true
          curl -s -m 60 "https://www.data.gouv.fr/api/1/datasets/?q=carte%20geologique%20haute-savoie&page_size=20" -o probe2/datagouv-search-74.json || true
          curl -s -m 60 "https://www.data.gouv.fr/api/1/datasets/?q=geologie%20savoie&page_size=20" -o probe2/datagouv-search-73.json || true
          curl -s -m 60 "https://data.europa.eu/api/hub/search/datasets/94636790-8615-11dc-9e02-0050568151b7" -o probe2/europa.json || true

      - name: Macrostrat (carte géologique mondiale ouverte)
        run: |
          for q in "lat=45.94&lng=6.21" "lat=45.97&lng=6.30" "lat=46.02&lng=6.25" "lat=45.90&lng=6.13" "lat=45.65&lng=6.15"; do
            curl -s -m 60 "https://macrostrat.org/api/v2/geologic_units/map?${q}&format=json" -o "probe2/macrostrat-$(echo $q | tr '=&.' '___').json" || true
          done
          curl -s -m 30 -D - -o probe2/macrostrat-tile.mvt -H "Origin: https://aligotaure.github.io" "https://tiles.macrostrat.org/carto/10/529/364.mvt" | grep -i -E "^(HTTP|access-control|content-type|content-length|content-encoding)" > probe2/macrostrat-tiles.txt || true

      - name: Publier les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe2
          git commit -q -m "Résultats de la sonde n°2" || echo "rien à committer"
          git push
