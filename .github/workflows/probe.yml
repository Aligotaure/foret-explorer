# Sonde temporaire n°10 : forêts publiques, parcs et réserves, PatriNat, PRSF.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zones protégées et forêts publiques
        run: python3 -u probe10/sonde.py
