# Sonde temporaire n°14 : tests de bout en bout après le réglage du compte à rebours.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Types, build, tests de bout en bout (deux passages)
        run: |
          mkdir -p verif
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check > verif/build.txt 2>&1 && echo "BUILD_OK" >> verif/build.txt
          npx playwright install --with-deps chromium > /dev/null
          for n in 1 2; do npm run test:e2e > verif/e2e-$n.txt 2>&1 || echo "E2E_ECHEC" >> verif/e2e-$n.txt; done
          grep -h -E "vérifications|ÉCHEC|BUILD_OK|error" verif/*.txt
      - name: Publier les résultats
        if: always()
        run: |
          git config user.name 'sonde'
          git config user.email 'sonde@users.noreply.github.com'
          git add -f verif
          git commit -qm "Résultats de la sonde n°14" && git push -q origin HEAD:data-probe || echo "rien à publier"
