# Sonde temporaire n°3 : géologie BD Charm-50 via le miroir référencé par data.gouv.fr.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Miroir data.cquest.org (référencé par data.gouv.fr)
        run: |
          mkdir -p probe3
          for u in "http://data.cquest.org/brgm/bd_charm_50/" "https://data.cquest.org/brgm/bd_charm_50/"; do
            code=$(curl -s -L -m 60 -o probe3/listing.html -w "%{http_code}" "$u" || echo 000)
            echo "$u -> $code $(stat -c %s probe3/listing.html 2>/dev/null)" >> probe3/mirror.txt
            [ "$code" = "200" ] && echo "BASE=$u" >> probe3/mirror.txt && break
          done
          grep -o -E 'href="[^"]+"' probe3/listing.html | sed 's/href="//;s/"$//' > probe3/listing.txt || true

      - name: Télécharger et décrire 074 et 073
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
          BASE=$(grep '^BASE=' probe3/mirror.txt | cut -d= -f2-)
          for d in 074 073; do
            f=$(grep -i -E "(^|/)[^/]*${d}[^/]*\.zip$" probe3/listing.txt | head -1)
            echo "$d -> fichier: $f" >> probe3/mirror.txt
            [ -z "$f" ] && continue
            case "$f" in http*) url="$f";; *) url="${BASE%/}/${f#./}";; esac
            code=$(curl -s -L -m 600 -o "geol${d}.zip" -w "%{http_code}" "$url" || echo 000)
            echo "$url -> $code $(stat -c %s "geol${d}.zip" 2>/dev/null)" >> probe3/mirror.txt
            unzip -l "geol${d}.zip" > "probe3/zip-${d}.txt" 2>&1 || true
            mkdir -p "g${d}" && (unzip -q -o "geol${d}.zip" -d "g${d}" || true)
            find "g${d}" -iname "*.zip" -exec unzip -q -o {} -d "g${d}" \; || true
            SHP=$(find "g${d}" -iname "*FGEOL*.shp" | head -1)
            echo "$d SHP=$SHP" >> probe3/mirror.txt
            if [ -n "$SHP" ]; then
              ogrinfo -so -al "$SHP" > "probe3/fgeol-info-${d}.txt" 2>&1
              ls "$(dirname "$SHP")" > "probe3/files-${d}.txt"
              ogr2ogr -f GeoJSONSeq -t_srs EPSG:4326 -simplify 5 -lco COORDINATE_PRECISION=5 "probe3/fgeol-${d}.geojsonl" "$SHP" 2>> probe3/mirror.txt
              gzip -9 "probe3/fgeol-${d}.geojsonl"
            fi
          done
          ls -la probe3 >> probe3/mirror.txt

      - name: Publier les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe3
          git commit -q -m "Résultats de la sonde n°3" || echo "rien à committer"
          git push
