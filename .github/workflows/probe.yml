# Sonde temporaire n°16 : taille des cases météo (deux périodes), miroir BRGM, nouveau classement des sols.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Préparer
        run: |
          mkdir -p verif
          npm ci --ignore-scripts --no-audit --no-fund > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
      - name: Miroir BRGM et classement des sols
        run: bash probe16/geologie.sh 2>&1 | tee verif/geologie16-log.txt | tail -120 || true
      - name: Étude des cases météo
        run: |
          npx esbuild probe16/etude.ts --bundle --platform=node --format=esm --outfile=probe16/etude.mjs \
            --define:import.meta.env.DEV=true --define:import.meta.env.VITE_METRICS_URL='""' --log-level=warning
          sed -i 's#verif/etude-cases#verif/etude16-cases#g' probe16/etude.mjs
          node probe16/etude.mjs 2>&1 | tee verif/etude16.txt || true
      - name: Publier les résultats
        if: always()
        run: |
          git config user.name 'sonde'
          git config user.email 'sonde@users.noreply.github.com'
          git add -f verif
          git commit -qm "Résultats de la sonde n°16" && git push -q origin HEAD:data-probe || echo "rien à publier"
