# Sonde temporaire n°5b : test de la chaîne de construction des tuiles de géologie.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire les tuiles de géologie
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
          bash -x scripts/geologie/construire.sh > construire.txt 2>&1 || echo "ÉCHEC code $?" >> construire.txt
          ogrinfo -so .cache/geologie/tout.geojsonl >> construire.txt 2>&1 || true
          mkdir -p probe5
          cp construire.txt probe5/
          cp .cache/geologie/rapport-*.json probe5/ || true
          cp public/data/geologie/info.json public/data/geologie/metadata.json probe5/ || true
          (cd public/data/geologie && find . -name '*.pbf' | awk -F/ '{print $2}' | sort | uniq -c) > probe5/tuiles-par-zoom.txt || true
          du -sh public/data/geologie >> probe5/tuiles-par-zoom.txt || true
          # Échantillon de tuiles autour d'Annecy / Parmelan pour les tests locaux (zooms 9 à 13).
          for z in 9 10 11 12 13; do
            n=$((1<<z))
            for lonlat in "6.13 45.90" "6.21 45.94" "6.30 45.97"; do
              set -- $lonlat
              x=$(python3 -c "print(int(($1+180)/360*$n))")
              y=$(python3 -c "import math; print(int((1-math.log(math.tan(math.radians($2))+1/math.cos(math.radians($2)))/math.pi)/2*$n))")
              for dx in -1 0 1; do for dy in -1 0 1; do
                f="public/data/geologie/$z/$((x+dx))/$((y+dy)).pbf"
                [ -f "$f" ] && mkdir -p "probe5/tuiles/$z/$((x+dx))" && cp "$f" "probe5/tuiles/$z/$((x+dx))/"
              done; done
            done
          done
          du -sh probe5 >> probe5/tuiles-par-zoom.txt
      - name: Publier les résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe5
          git commit -q -m "Résultats de la sonde n°5" || echo "rien à committer"
          git push
