# Sonde temporaire n°7d : vérification de types du serveur de mesure avec les fichiers de verrouillage.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serveur de mesure
        working-directory: worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run --outdir dist
      - name: Carte
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
