# Sonde temporaire n°15 : taille des cases météo, masque France, zones et géologie nationales.
name: Sonde des sources de données

on:
  push:
    branches: [data-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Préparer
        run: |
          mkdir -p verif
          npm ci --ignore-scripts --no-audit --no-fund > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
      - name: Masque France et nombre de cases
        run: node probe15/masque.mjs 2>&1 | tee verif/masque.txt || true
      - name: Zones sur toute la France
        run: python3 -u probe15/zones-france.py 2>&1 | tee verif/zones-france.txt || true
      - name: Géologie de toute la France (tailles, classement de 4 départements)
        run: bash probe15/geologie-france.sh 2>&1 | tail -80 || true
      - name: Étude des cases météo
        run: |
          npx esbuild probe15/etude.ts --bundle --platform=node --format=esm --outfile=probe15/etude.mjs \
            --define:import.meta.env.DEV=true --define:import.meta.env.VITE_METRICS_URL='""' --log-level=warning
          node probe15/etude.mjs 2>&1 | tee verif/etude.txt || true
      - name: Publier les résultats
        if: always()
        run: |
          git config user.name 'sonde'
          git config user.email 'sonde@users.noreply.github.com'
          git add -f verif
          git commit -qm "Résultats de la sonde n°15" && git push -q origin HEAD:data-probe || echo "rien à publier"
