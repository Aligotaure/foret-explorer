# Publie la carte sur GitHub Pages à chaque push sur main :
# https://aligotaure.github.io/foret-explorer/
#
# Avant le build, construit les tuiles « nature du sol » à partir des cartes géologiques du BRGM
# (scripts/geologie/construire.sh) : elles sont servies par GitHub Pages avec le site.
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
      - name: Cartes géologiques BRGM en cache
        uses: actions/cache@v4
        with:
          path: .cache/geologie/*.zip
          key: geologie-brgm-${{ hashFiles('scripts/geologie/construire.sh') }}
      - name: Construire les tuiles « nature du sol »
        run: bash scripts/geologie/construire.sh
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Vérifier les types et construire
        run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
