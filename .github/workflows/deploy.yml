# Publie la carte sur GitHub Pages à chaque push sur main :
# https://aligotaure.github.io/foret-explorer/
#
# Aussi relancée par la tâche « Météo commune » (meteo.yml) quand de nouveaux fichiers météo sont prêts.
#
# 1. Reprend les tuiles « nature du sol » de toute la France (cache, refaites seulement quand les
#    scripts de scripts/geologie/ changent : ≈ 2,7 Go de cartes du BRGM à télécharger), celles des
#    zones protégées et forêts publiques (cache, ou à défaut le site en ligne ; refaites depuis le WFS
#    une fois par an, ou quand leurs scripts changent) et les derniers fichiers météo communs : tout
#    cela est servi par GitHub Pages avec le site. Si une reconstruction échoue, les tuiles
#    précédentes restent ; sans tuiles du tout, rien n'est publié.
#    Les tuiles sont rangées dans une archive PMTiles par couche : GitHub Pages abandonne une
#    publication au bout de 10 minutes, et des dizaines de milliers de petits fichiers n'y passent pas.
# 2. Teste le serveur de mesure (worker/) et, si les secrets Cloudflare existent, le publie :
#    son adresse est alors donnée au build pour que la carte y envoie ses compteurs.
# 3. Vérifie les types, construit la carte et la publie.
#
# Sécurité : actions épinglées sur leur identifiant de commit (mises à jour par Dependabot),
# dépendances installées avec `npm ci --ignore-scripts` (versions figées par les
# package-lock.json, aucun script d'installation exécuté), pas de cache npm partagé, jeton
# GitHub non conservé après le checkout. Les secrets Cloudflare ne sont visibles que de
# l'étape qui publie le serveur de mesure.
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication en cours va au bout (elle garde les tuiles construites en cache) ; la suivante attend.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # ── Données servies avec le site : tuiles gardées en cache, refaites seulement s'il le faut ──
      - name: Tuiles « nature du sol » en cache
        id: geologie
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data/geologie
          key: geologie-tuiles-${{ hashFiles('scripts/geologie/*') }}
          # Scripts modifiés : on garde les tuiles précédentes si la reconstruction échoue.
          restore-keys: geologie-tuiles-
      - name: Tuiles des zones protégées et des forêts publiques en cache
        id: zones
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data/zones
          # Chaque archive est gardée sous un nom à elle (voir « Garder les tuiles des zones ») : ce nom
          # exact n'existe jamais. On reprend la plus récente faite avec les scripts actuels, à défaut
          # la plus récente tout court (scripts modifiés depuis : elle sera refaite).
          key: zones-tuiles-${{ hashFiles('scripts/zones/*') }}
          restore-keys: |
            zones-tuiles-${{ hashFiles('scripts/zones/*') }}-
            zones-tuiles-
      - name: Zones protégées à refaire ? (une fois par an, ou quand leurs scripts changent)
        # Les zones bougent peu : une actualisation par an suffit (demande de Clément du 16/11/2026 ;
        # avant, chaque semaine). Sans archive en cache (cache perdu, premier passage), on reprend
        # celle du site en ligne, sans appeler le WFS. L'archive n'est refaite que si elle a un an ou
        # plus, si les scripts de scripts/zones/ ont changé depuis, ou s'il n'y en a nulle part.
        id: zones-age
        env:
          CLE: ${{ steps.zones.outputs.cache-matched-key }}
          PREFIXE: zones-tuiles-${{ hashFiles('scripts/zones/*') }}-
          EN_LIGNE: https://aligotaure.github.io/foret-explorer/data/zones
        run: |
          dossier=public/data/zones
          source=cache
          if [ ! -s "$dossier/zones.pmtiles" ] || [ ! -s "$dossier/info.json" ]; then
            source=aucune
            # Téléchargée à part : une archive arrivée incomplète ne remplace rien.
            tmp=$(mktemp -d)
            if curl -fsS --retry 3 --connect-timeout 10 -m 120 -o "$tmp/info.json" "$EN_LIGNE/info.json" \
              && curl -fsS --retry 3 --connect-timeout 10 -m 600 -o "$tmp/zones.pmtiles" "$EN_LIGNE/zones.pmtiles" \
              && [ "$(head -c 7 "$tmp/zones.pmtiles")" = PMTiles ]; then
              rm -rf "$dossier" && mkdir -p "$dossier" && mv "$tmp/info.json" "$tmp/zones.pmtiles" "$dossier/"
              source=site
            fi
            rm -rf "$tmp"
          fi
          # Âge en jours, d'après la date de construction écrite dans info.json (champ « genere »).
          age=
          if [ "$source" != aucune ]; then
            age=$(node -e 'const g = Date.parse(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).genere); if (Number.isFinite(g)) console.log(Math.floor((Date.now() - g) / 864e5))' "$dossier/info.json" 2>/dev/null) || age=
          fi
          if [ "$source" = aucune ]; then
            raison="aucune archive, ni en cache ni sur le site en ligne"
          elif [ "$source" = cache ] && [[ "$CLE" != "$PREFIXE"* ]]; then
            raison="scripts de scripts/zones/ modifiés depuis l'archive en cache"
          elif [ -z "$age" ]; then
            raison="date de l'archive illisible"
          elif [ "$age" -ge 365 ]; then
            raison="archive de $age jours"
          else
            raison=
          fi
          if [ -n "$raison" ]; then
            echo "Zones protégées à refaire : $raison."
            echo "refaire=oui" >> "$GITHUB_OUTPUT"
          elif [ "$source" = site ]; then
            echo "Zones protégées gardées : archive de $age jours, reprise du site en ligne."
          else
            echo "Zones protégées gardées : archive de $age jours, en cache."
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Installer GDAL
        if: steps.geologie.outputs.cache-hit != 'true' || steps.zones-age.outputs.refaire == 'oui'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
      - name: Construire les tuiles « nature du sol » (France entière, une dizaine de minutes)
        id: geologie-construire
        if: steps.geologie.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/geologie/construire.sh
      - name: Garder les tuiles « nature du sol »
        if: steps.geologie-construire.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data/geologie
          key: geologie-tuiles-${{ hashFiles('scripts/geologie/*') }}
      - name: Construire les tuiles des zones protégées et des forêts publiques (France entière)
        id: zones-construire
        if: steps.zones-age.outputs.refaire == 'oui'
        continue-on-error: true
        run: bash scripts/zones/construire.sh
      - name: Garder les tuiles des zones
        # Archive neuve, ou reprise du site en ligne (pour ne pas la retélécharger à chaque
        # publication). Un nom par exécution : une entrée du cache ne se remplace pas.
        if: steps.zones-construire.outcome == 'success' || steps.zones-age.outputs.source == 'site'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data/zones
          key: zones-tuiles-${{ hashFiles('scripts/zones/*') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fichiers météo communs (dernier passage de la tâche « Météo commune »)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/data/meteo
            .meteo-etat.json
          key: meteo-${{ github.run_id }}
          restore-keys: meteo-
      - name: Mettre en forme les fichiers météo (sans cache, reprendre ceux du site en ligne)
        # Aucun appel à Open-Meteo ici (budget 0) : les fichiers sont réécrits avec la liste des cases
        # du dépôt (altitudes des carrés de 4,5 km). Sans fichiers du tout, la carte interroge
        # Open-Meteo elle-même (quelques dizaines de cases au plus).
        continue-on-error: true
        run: |
          node scripts/meteo/mettre-a-jour.mjs --budget 0 --etat "$RUNNER_TEMP/meteo-etat.json" \
            --amorce https://aligotaure.github.io/foret-explorer/data/meteo/
      - name: Vérifier que les données sont là
        # Une couche manquante (première construction ratée) : on ne publie pas, le site en ligne
        # reste tel quel et la prochaine publication réessaie.
        run: |
          manque=0
          for f in public/data/geologie/info.json public/data/geologie/geologie.pmtiles public/data/zones/info.json public/data/zones/zones.pmtiles; do
            if [ ! -s "$f" ]; then
              echo "::error::$f manquant, publication annulée pour ne pas retirer une couche du site en ligne."
              manque=1
            fi
          done
          if [ ! -f public/data/meteo/index.json ]; then
            echo "::warning::Pas de fichiers météo communs, la carte interrogera Open-Meteo elle-même."
          fi
          du -sh public/data/* 2>/dev/null || true
          find public/data -type f | wc -l | sed 's/$/ fichiers de données/'
          exit $manque
      - name: Installer les dépendances
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tester le serveur de mesure
        working-directory: worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Serveur de mesure configuré ?
        id: config
        env:
          CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: echo "actif=$CONFIGURED" >> "$GITHUB_OUTPUT"
      - name: Publier le serveur de mesure (Cloudflare)
        id: mesures
        if: steps.config.outputs.actif == 'true'
        # Un souci côté Cloudflare ne doit pas bloquer la carte : elle part alors sans mesure.
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then echo "::error::Adresse du serveur de mesure introuvable dans la sortie de wrangler"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          if [ -n "$ADMIN_PATH" ]; then printf '%s' "$ADMIN_PATH" | npx wrangler secret put ADMIN_PATH; fi
          if [ -z "$ADMIN_PASSWORD" ] || [ -z "$ADMIN_PATH" ]; then
            echo "::warning::Secrets ADMIN_PASSWORD et ADMIN_PATH manquants : la page privée reste fermée."
          fi
      - name: Tester les scripts de données (météo commune simulée, règles des sols sur toute la France)
        run: npm run test:donnees
      - name: Moyennes de France par champignon (chiffre des puces)
        # À partir des fichiers météo du jour, avant la construction du site qui les recopie. Ne doit
        # jamais bloquer la publication : sans ce fichier, les puces n'affichent pas de chiffre.
        continue-on-error: true
        run: |
          # Toujours un fichier, même vide : la carte le demande à chaque visite, et un fichier absent
          # laisserait une erreur 404 dans la console du navigateur. Vide, il n'affiche aucun chiffre.
          mkdir -p public/data/meteo
          echo '{"v":1,"maj":"","jour":"","mois":0,"moyennes":{},"carres":{}}' > public/data/meteo/france.json
          if [ -f public/data/meteo/index.json ]; then
            node scripts/meteo/france.mjs --meteo public/data/meteo --parts public/foret/parts.json --sortie public/data/meteo/france.json
          else
            echo "::warning::Pas de fichiers météo communs : pas de moyennes de France."
          fi
      - name: Vérifier les types et construire
        run: npm run check
        env:
          # Vide si le serveur de mesure n'est pas configuré : la carte n'envoie alors rien.
          VITE_METRICS_URL: ${{ steps.mesures.outputs.url }}
      - name: Taille du site
        run: |
          taille=$(du -sm dist | cut -f1)
          fichiers=$(find dist -type f | wc -l)
          echo "Site : ${taille} Mo, ${fichiers} fichiers (GitHub Pages : 1 Go au plus, publication en 10 minutes au plus)"
          if [ "$taille" -gt 950 ] || [ "$fichiers" -gt 5000 ]; then
            echo "::error::Site trop gros pour GitHub Pages (${taille} Mo, ${fichiers} fichiers)."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
