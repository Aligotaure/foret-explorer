# Met à jour les fichiers météo communs (public/data/meteo/) que lit la carte au lieu d'appeler
# Open-Meteo depuis chaque navigateur : pluie et températures des 30 derniers jours, cases d'environ
# 18 km sur toute la France métropolitaine (scripts/meteo/mettre-a-jour.mjs).
#
# Progressif, pour rester loin des limites d'Open-Meteo : chaque passage a un budget d'appels, chaque
# case n'est demandée qu'une fois par jour et seulement pour les jours qui lui manquent (un appel
# par case : ≈ 2 000 appels par jour pour toute la France). Le premier passage de la journée fait
# d'ordinaire tout le tour ; les autres ne trouvent rien à faire et s'arrêtent en quelques secondes.
# L'état d'un passage à l'autre (fichiers, appels dépensés) est gardé dans le cache d'Actions ; s'il
# a disparu, on repart des fichiers du site en ligne. Quand le tour est fini (ou au bout de 6 h s'il
# traîne), la publication du site est relancée pour mettre les nouveaux fichiers en ligne.
#
# Un déclenchement par heure, parce que GitHub lance les tâches planifiées quand il peut : souvent
# avec des heures de retard, parfois pas du tout (constaté ici : un seul passage en dix heures pour
# une tâche prévue toutes les deux heures). Plus il y a d'occasions, plus le tour du jour est tôt.
#
# Attention : GitHub suspend les tâches planifiées d'un dépôt public sans activité depuis 60 jours ;
# il suffit alors de la réactiver dans l'onglet Actions (la carte affiche la date de la météo).
name: Météo commune

on:
  schedule:
    - cron: '41 * * * *' # minute peu demandée : les tâches programmées à l'heure pile prennent du retard
  workflow_dispatch:
    inputs:
      budget:
        description: Appels pondérés au plus pour ce passage
        required: false
        default: '2500'

permissions:
  contents: read
  actions: write # relancer la publication du site

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Reprendre l'état du dernier passage
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/data/meteo
            .meteo-etat.json
          key: meteo-${{ github.run_id }}
          restore-keys: meteo-
      - name: Mettre à jour les fichiers météo
        id: maj
        env:
          BUDGET: ${{ inputs.budget || '2500' }}
        run: node scripts/meteo/mettre-a-jour.mjs --budget "$BUDGET" --amorce https://aligotaure.github.io/foret-explorer/data/meteo/
      - name: Garder l'état pour le prochain passage
        if: always() && steps.maj.outputs.garder == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/data/meteo
            .meteo-etat.json
          key: meteo-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Republier le site
        if: steps.maj.outputs.publier == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main
