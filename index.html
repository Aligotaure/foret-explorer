<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161630" />
    <meta name="description" content="Carte des types de forêt (IGN BD Forêt V2) avec légende filtrable." />
    <title>Forêt Explorer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- « Ajouter à l'écran d'accueil » : la carte s'ouvre en plein écran comme une appli -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Forêts" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Vue demandée par l'adresse (#vue=analytics), posée avant le premier affichage : la carte
      // n'apparaît pas un instant derrière la vue Analytics. Même règle que src/view.ts.
      if (/(?:^#|&)vue=analytics(?:&|$)/.test(location.hash)) document.documentElement.dataset.view = 'analytics';
      // Sinon la page s'ouvre sur la carte : son code est demandé tout de suite, sans attendre la
      // feuille de style (nom du fichier écrit au build par vite.config.ts ; vide en développement).
      else if ('__MAP_CHUNK__') {
        document.head.append(Object.assign(document.createElement('link'), { rel: 'modulepreload', href: '__MAP_CHUNK__' }));
      }
    </script>
  </head>
  <body>
    <!-- Îlot : bascule entre la carte et la vue Analytics (src/view.ts) -->
    <nav id="view-switch" class="island" aria-label="Vues">
      <a class="island__link" href="./" data-view="map" aria-current="page">Carte</a>
      <a class="island__link" href="#vue=analytics" data-view="analytics">Analytics</a>
    </nav>
    <p id="view-status" class="visually-hidden" role="status"></p>
    <div id="view-error" class="view-error" role="alert" hidden></div>

    <div id="app">
      <div id="map" role="region" aria-label="Carte"></div>

      <!-- Barre du haut : bouton légende + recherche de lieu -->
      <div class="topbar">
        <button id="legend-toggle" class="btn-square" type="button" aria-controls="legend"></button>
        <form id="search" class="search" role="search" autocomplete="off">
          <input
            id="search-input"
            class="search__input"
            type="search"
            placeholder="Rechercher un lieu…"
            aria-label="Rechercher un lieu"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="search-results"
            aria-expanded="false"
          />
          <button class="search__submit" type="submit" aria-label="Rechercher"></button>
          <ul id="search-results" class="search__results" role="listbox" hidden></ul>
        </form>
      </div>

      <!-- Panneau « Légendes » (rempli par src/legend.ts) -->
      <aside id="legend" class="panel" aria-label="Légendes"></aside>

      <!-- Bilan d'un coin, au clic sur la carte (rempli par src/spot.ts) -->
      <aside id="spot" class="panel panel--spot" aria-label="Bilan du coin" hidden></aside>

      <!-- Barres d'outils (remplies par src/toolbar.ts) -->
      <div id="toolbar-top" class="toolbar toolbar--top"></div>
      <div id="toolbar-bottom" class="toolbar toolbar--bottom"></div>

      <div id="zoom-hint" class="zoom-hint" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <!-- Vue Analytics (remplie par src/analyticsView.ts, chargé à la première ouverture) -->
    <main id="analytics" class="analytics"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
